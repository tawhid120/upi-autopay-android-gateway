name: payviro_upi
description: "Payviro UPI - Automated PhonePe, Google Pay, Paytm, BHIM, CRED & Bank UPI Payment Verification Gateway"
publish_to: 'none'

version: 2.3.0+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2

  # Local Offline Database
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Network & Firebase REST API
  http: ^1.2.1
  connectivity_plus: ^6.0.3

  # Preferences & Settings
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Permissions (SMS, Notifications, Battery Optimization)
  permission_handler: ^11.3.1

  # SMS Inbox Reading
  flutter_sms_inbox: ^1.0.3

  # Background Service & Notifications
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.1.2

  # Utilities & UI
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
