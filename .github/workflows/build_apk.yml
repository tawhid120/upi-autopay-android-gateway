name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Project Scaffolding
        run: |
          mkdir -p /tmp/payverify_backup
          cp android/app/src/main/AndroidManifest.xml /tmp/payverify_backup/ || true
          cp -r android/app/src/main/kotlin /tmp/payverify_backup/ || true
          cp -r android/app/src/main/res /tmp/payverify_backup/ || true
          cp android/key.properties /tmp/payverify_backup/ || true
          cp android/app/payverify-release.jks /tmp/payverify_backup/ || true
          cp android/payverify-release.jks /tmp/payverify_backup/ || true
          
          rm -rf android
          flutter create --platforms=android --org com.payverify --project-name bd .
          
          cp /tmp/payverify_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/kotlin/*
          mkdir -p android/app/src/main/kotlin/com/payverify/bd
          cp -r /tmp/payverify_backup/kotlin/com/payverify/bd/* android/app/src/main/kotlin/com/payverify/bd/
          cp -r /tmp/payverify_backup/res/* android/app/src/main/res/
          
          # Restore or generate key.properties
          echo "storePassword=6251@TAWHId" > android/key.properties
          echo "keyPassword=6251@TAWHId" >> android/key.properties
          echo "keyAlias=tawhid" >> android/key.properties
          echo "storeFile=payverify-release.jks" >> android/key.properties
          
          # Restore release keystore or decode from embedded base64
          if [ -f /tmp/payverify_backup/payverify-release.jks ]; then
            cp /tmp/payverify_backup/payverify-release.jks android/app/payverify-release.jks
            cp /tmp/payverify_backup/payverify-release.jks android/payverify-release.jks
          fi
          if [ ! -f android/app/payverify-release.jks ]; then
            echo "" | base64 -d > android/app/payverify-release.jks
            cp android/app/payverify-release.jks android/payverify-release.jks
          fi
          
          python3 - << 'PYEOF'
          import os, re
          for path in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(path):
                  with open(path, 'r') as f:
                      c = f.read()
                  is_kts = path.endswith('.kts')
                  if 'isCoreLibraryDesugaringEnabled' not in c and 'coreLibraryDesugaringEnabled' not in c:
                      desugar_opt = '        isCoreLibraryDesugaringEnabled = true' if is_kts else '        coreLibraryDesugaringEnabled true'
                      c = c.replace('compileOptions {', f'compileOptions {{\n{desugar_opt}')
                  if 'coreLibraryDesugaring' not in c:
                      dep = 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n' if is_kts else "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
                      c += f'\n{dep}'
                  if is_kts:
                      c = re.sub(r'minSdk\s*=.*', 'minSdk = 23', c)
                      c = re.sub(r'versionCode\s*=.*', 'versionCode = 7', c)
                      c = re.sub(r'versionName\s*=.*', 'versionName = "2.4.0"', c)
                  else:
                      c = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 23', c)
                      c = re.sub(r'versionCode\s+.*', 'versionCode 7', c)
                      c = re.sub(r'versionName\s+.*', 'versionName "2.4.0"', c)

                  # Inject Tawhid Release Signing
                  if is_kts:
                      header = 'import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n'
                      c = header + '\n' + c
                      signing_block = '    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String? ?: "tawhid"\n            keyPassword = keystoreProperties["keyPassword"] as String? ?: "6251@TAWHId"\n            val sf = keystoreProperties["storeFile"] as String? ?: "payverify-release.jks"\n            storeFile = if (file(sf).exists()) file(sf) else rootProject.file(sf)\n            storePassword = keystoreProperties["storePassword"] as String? ?: "6251@TAWHId"\n        }\n    }\n'
                      c = c.replace('buildTypes {', signing_block + '\n    buildTypes {')
                      c = c.replace('signingConfigs.getByName("debug")', 'if (keystorePropertiesFile.exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")')
                  else:
                      header = 'def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n'
                      c = header + '\n' + c
                      signing_block = '    signingConfigs {\n        release {\n            if (keystorePropertiesFile.exists()) {\n                keyAlias keystoreProperties["keyAlias"]\n                keyPassword keystoreProperties["keyPassword"]\n                def sf = keystoreProperties["storeFile"] ?: "payverify-release.jks"\n                storeFile file(sf).exists() ? file(sf) : rootProject.file(sf)\n                storePassword keystoreProperties["storePassword"]\n            }\n        }\n    }\n'
                      c = c.replace('buildTypes {', signing_block + '\n    buildTypes {')
                      c = c.replace('signingConfig signingConfigs.debug', 'if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release else signingConfig signingConfigs.debug')

                  with open(path, 'w') as f:
                      f.write(c)
          PYEOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release --build-name=2.4.0 --build-number=7
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Payviro-UPI-v2.4.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payverify-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: Payviro UPI v2.4.0 — Indian UPI & Banking AutoPay Gateway (Full English Edition)
          make_latest: true
          body: |
            ## 🚀 Payviro UPI v2.4.0 — Indian UPI & Banking AutoPay Gateway Release (Full English Edition)
            
            ### ✨ Features:
            - **100% English UI & Localization**: Full English interface, alert dialogs, restricted settings walkthrough, webhook telemetry, and background sync notifications.
            - **Indian UPI Support**: Real-time automated verification for PhonePe, Google Pay (GPay), Paytm, FamPay, BHIM, CRED, Amazon Pay, and all major Indian Banks (SBI, HDFC, ICICI, Axis, Kotak, PNB, etc.).
            - **12-Digit UTR Extraction**: Ultra-fast regex parsing capturing 12-digit UTR/RRN numbers and INR (₹) amounts.
            - **Webhook Auto-Sync**: Instant HTTP POST forwarding to Telegram bot / Cheapbot webhook endpoint (`/api/upi/webhook`).
            - **Android 14, 15 & 16 Compatible**: Built with `NotificationListenerService` and sideloaded app restricted settings walkthrough to easily bypass Google Play Protect restrictions.
            - **Trusted Release Signing**: Signed with official keystore footprint (`payverify-release.jks`) to prevent Google Play Protect installation blocks.
            - **Apple Liquid Glass UI**: Apple-inspired design with Dark (OLED) and Light mode, live status telemetry, and offline queue.
            
            ### 📥 Download:
            Download `app-release.apk` or `Payviro-UPI-v2.4.0.apk` below and install directly on your Android device.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/Payviro-UPI-v2.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
